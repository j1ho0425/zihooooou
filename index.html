<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>베이킹 레시피 저장소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧁 베이킹 레시피 저장소</h1>
            <button class="add-btn" id="addRecipeBtn">+ 새 레시피 추가</button>
        </header>

        <main>
            <div class="recipe-list" id="recipeList">
                <!-- 레시피 카드들이 여기에 들어갈 것 -->
            </div>
        </main>
    </div>

    <!-- 레시피 추가 모달 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>새 레시피 추가</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>
            <form id="recipeForm">
                <div class="form-group">
                    <label for="recipeName">레시피 이름</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-group">
                    <label for="recipeImage">사진 URL</label>
                    <input type="url" id="recipeImage" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label for="recipeText">레시피 내용</label>
                    <textarea id="recipeText" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">저장하기</button>
            </form>
        </div>
    </div>

    <!-- 레시피 상세 보기 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content detail-content">
            <div class="modal-header">
                <h2 id="detailTitle">레시피 상세</h2>
                <button class="close-btn" id="closeDetailBtn">×</button>
            </div>
            <div class="detail-body">
                <img id="detailImage" class="detail-image" src="" alt="">
                <div class="detail-info">
                    <h3 id="detailName"></h3>
                    <p id="detailRecipe"></p>
                </div>
                <div class="detail-buttons">
                    <button class="edit-btn" id="editRecipeBtn">수정하기</button>
                    <button class="delete-btn" id="deleteRecipeBtn">삭제하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 레시피 수정 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>레시피 수정</h2>
                <button class="close-btn" id="closeEditBtn">×</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editRecipeId">
                <div class="form-group">
                    <label for="editRecipeName">레시피 이름</label>
                    <input type="text" id="editRecipeName" required>
                </div>
                <div class="form-group">
                    <label for="editRecipeImage">사진 URL</label>
                    <input type="url" id="editRecipeImage" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label for="editRecipeText">레시피 내용</label>
                    <textarea id="editRecipeText" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">수정하기</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
